openapi: 3.1.0
info:
  title: Pandu Rute API
  version: 0.1.0
  description: |
    Mobile-facing API of Pandu Rute: Anti Bingung.

    Trip plans are computed by OpenTripPlanner behind the API (configured with
    `OTP_BASE_URL`). When it is unreachable, `POST /v1/trip-plans` answers
    valid requests with `503 ROUTING_UNAVAILABLE`. Itinerary times are
    currently always `frequency_estimate`.

    Itineraries with the same journey structure (same legs, lines and
    stops; departures may differ) are merged into one, so fewer than
    `maxItineraries` may be returned. Every returned itinerary contains at
    least one transit leg: walk-only results are currently not returned and
    yield `NO_ROUTE` when nothing else remains.

    Routing input is coordinates only. `label` is display text that is
    echoed back; it is never geocoded or used for routing.

    `GET /v1/stops` searches TransJakarta GTFS stops by name, so a client can
    turn a chosen stop into coordinates for `POST /v1/trip-plans`. The stops
    are loaded at startup from the file named by `GTFS_STOPS_PATH`; without a
    usable file it answers `503 STOP_INDEX_UNAVAILABLE`. Stop IDs are only
    stable within one data version, and a stop found by search may lie
    outside the area trip planning can currently route.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      summary: Liveness check
      description: Reports that the process serves HTTP. Does not check routing availability.
      operationId: getHealth
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /v1/trip-plans:
    post:
      summary: Plan a trip between two coordinates
      operationId: createTripPlan
      requestBody:
        required: true
        description: JSON body of at most 4096 bytes. Unknown fields and trailing JSON values are rejected.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripPlanRequest"
            example:
              origin: { lat: -6.2, lon: 106.8, label: Rumah }
              destination: { lat: -6.1, lon: 106.81 }
              departAt: "2026-10-12T08:00:00+07:00"
              maxItineraries: 3
      responses:
        "200":
          description: Itineraries from the configured routing engine.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripPlanResponse"
        "400":
          $ref: "#/components/responses/Error"
        "405":
          description: Method not allowed (plain-text response from the router, not the error envelope).
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /v1/stops:
    get:
      summary: Search TransJakarta stops by name
      description: |
        Matching is case-insensitive; punctuation and repeated spaces are
        ignored. No abbreviations are expanded. Results are ordered by match
        type (exact, prefix, word-prefix, substring), then shorter name, then
        name, then ID. Unknown or repeated query parameters are rejected.
        Stations, platforms and stops are all returned and never grouped;
        `kind`, `platformCode` and `parentStationId` help tell identical names
        apart when the feed provides them.

        A returned stop is not guaranteed to be routable: it may lie outside
        the area trip planning currently covers, in which case
        `POST /v1/trip-plans` answers `422 LOCATION_NOT_ROUTABLE`.
      operationId: searchStops
      parameters:
        - name: q
          in: query
          required: true
          description: Search text, 2–100 characters after trimming. Control characters are rejected.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Matching stops; an empty list when nothing matches.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopSearchResponse"
              example:
                stops:
                  - { id: "tj:stop:A1", name: Halte Contoh, lat: -6.2, lon: 106.8 }
                attributions:
                  - id: transjakarta-gtfs
                    text: GTFS Static Transjakarta © 2026 PT Transportasi Jakarta, dilisensikan di bawah CC BY 4.0. Diolah oleh Pandu Rute.
                    license: CC-BY-4.0
                    licenseUrl: https://creativecommons.org/licenses/by/4.0/
                    sourceUrl: https://ppid.transjakarta.co.id/informasi/berkala
                dataVersion: null
        "400":
          $ref: "#/components/responses/Error"
        "405":
          description: Method not allowed (plain-text response from the router, not the error envelope).
        "503":
          $ref: "#/components/responses/Error"
components:
  headers:
    X-Request-Id:
      description: Server-generated request identifier, also present in error bodies.
      schema:
        type: string
        pattern: "^req_[0-9a-f]{24}$"
  responses:
    Error:
      description: |
        Stable error envelope. `message` is fixed Indonesian text per code;
        upstream error text is never included.

        | code | HTTP |
        |---|---|
        | INVALID_INPUT | 400 |
        | PAYLOAD_TOO_LARGE | 413 |
        | UNSUPPORTED_MEDIA_TYPE | 415 |
        | NO_ROUTE | 422 |
        | OUT_OF_COVERAGE | 422 |
        | LOCATION_NOT_ROUTABLE | 422 |
        | INTERNAL | 500 |
        | UPSTREAM_INVALID_RESPONSE | 502 |
        | ROUTING_UNAVAILABLE | 503 |
        | STOP_INDEX_UNAVAILABLE | 503 |
        | ROUTING_TIMEOUT | 504 |
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: INVALID_INPUT
              message: Permintaan tidak valid. Periksa kembali data yang dikirim.
              details:
                - { field: origin.lat, reason: out_of_range }
              requestId: req_0123456789abcdef01234567
  schemas:
    LocationInput:
      type: object
      additionalProperties: false
      required: [lat, lon]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 latitude in decimal degrees.
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 longitude in decimal degrees.
        label:
          type: string
          maxLength: 100
          description: Display text, echoed back. Never geocoded. Control characters are rejected.
    TripPlanRequest:
      type: object
      additionalProperties: false
      required: [origin, destination]
      properties:
        origin:
          $ref: "#/components/schemas/LocationInput"
        destination:
          $ref: "#/components/schemas/LocationInput"
        departAt:
          type: string
          format: date-time
          description: |
            RFC 3339 with an explicit offset (`Z` or `±hh:mm`). Defaults to the
            current time, expressed in WIB (UTC+07:00).
        maxItineraries:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
    Location:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
        label: { type: string }
    Place:
      type: object
      required: [name, lat, lon]
      properties:
        stopId:
          type: string
          description: App-owned stop identifier; absent for non-stop places.
        name: { type: string }
        lat: { type: number }
        lon: { type: number }
    Line:
      type: object
      required: [id, shortName]
      properties:
        id: { type: string, description: App-owned line identifier. }
        shortName: { type: string }
        longName: { type: string }
    Leg:
      type: object
      required: [type, mode, from, to, durationSeconds, distanceMeters]
      properties:
        type: { type: string, enum: [transit, walk] }
        mode: { type: string, examples: [bus, walk] }
        line:
          $ref: "#/components/schemas/Line"
          description: Present on transit legs only.
        headsign: { type: string }
        from: { $ref: "#/components/schemas/Place" }
        to: { $ref: "#/components/schemas/Place" }
        durationSeconds: { type: integer, minimum: 0 }
        distanceMeters: { type: integer, minimum: 0 }
    Itinerary:
      type: object
      required: [departure, arrival, timeQuality, durationSeconds, transfers, walkDistanceMeters, legs]
      properties:
        departure: { type: string, format: date-time, description: Expressed in WIB (UTC+07:00). }
        arrival: { type: string, format: date-time, description: Expressed in WIB (UTC+07:00). }
        timeQuality:
          type: string
          enum: [scheduled, frequency_estimate]
          description: "`frequency_estimate` times come from headway-based service and must be shown as approximate."
        durationSeconds: { type: integer, minimum: 0 }
        transfers: { type: integer, minimum: 0 }
        walkDistanceMeters: { type: integer, minimum: 0 }
        legs:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Leg" }
    Attribution:
      type: object
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string }
        license: { type: string }
        licenseUrl: { type: string, format: uri }
        sourceUrl: { type: string, format: uri }
    SourceVersion:
      type: object
      required: [id]
      properties:
        id: { type: string }
        sha256: { type: string }
        lastModified: { type: string, format: date-time }
        retrievedAt: { type: string, format: date-time }
    DataVersion:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceVersion" }
        graphBuiltAt: { type: string, format: date-time }
    TripPlanResponse:
      type: object
      required: [origin, destination, requestedDepartAt, itineraries, attributions, dataVersion]
      properties:
        origin: { $ref: "#/components/schemas/Location" }
        destination: { $ref: "#/components/schemas/Location" }
        requestedDepartAt: { type: string, format: date-time }
        itineraries:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/Itinerary" }
        attributions:
          type: array
          minItems: 1
          description: Data-source credits required by the data licences. Always present on success.
          items: { $ref: "#/components/schemas/Attribution" }
        dataVersion:
          description: Routing data version, or null when the routing engine does not report one.
          oneOf:
            - $ref: "#/components/schemas/DataVersion"
            - type: "null"
    Stop:
      type: object
      required: [id, name, lat, lon]
      properties:
        id:
          type: string
          description: App-owned stop ID (`tj:stop:<GTFS stop_id>`), the same format as `Place.stopId`.
        name:
          type: string
          description: GTFS `stop_name`, unchanged. Several stops can share a name.
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        kind:
          type: string
          enum: [station, platform, stop]
          description: |
            Display hint from GTFS `location_type`, omitted when unknown:
            `station` for type 1; `platform` for type 0 or empty whose
            `parent_station` is a station in the same file; `stop` for type 0 or
            empty otherwise. Omitted when the file has no `location_type` column
            or the value is anything else. Clients must treat values they do not
            recognise as unknown.
        platformCode:
          type: string
          description: GTFS `platform_code` as given; omitted when blank. A label only.
        parentStationId:
          type: string
          description: |
            ID (same `tj:stop:` format) of the station this platform belongs to.
            Present only when `parent_station` refers to a station loaded from
            the same file; dangling or non-station references are omitted.
    StopSearchResponse:
      type: object
      required: [stops, attributions, dataVersion]
      properties:
        stops:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Stop" }
        attributions:
          type: array
          minItems: 1
          description: Data-source credits required by the data licence. Always present on success.
          items: { $ref: "#/components/schemas/Attribution" }
        dataVersion:
          description: SHA-256 of the loaded stops file (source id `gtfs-stops`), or null when unknown.
          oneOf:
            - $ref: "#/components/schemas/DataVersion"
            - type: "null"
    ErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field: { type: string, examples: [origin.lat, body, q] }
        reason:
          type: string
          enum: [required, out_of_range, invalid_type, invalid_format, too_long, too_short, unknown_field, malformed_json, trailing_data, outside_service_area, not_routable]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [INVALID_INPUT, UNSUPPORTED_MEDIA_TYPE, PAYLOAD_TOO_LARGE, NO_ROUTE, OUT_OF_COVERAGE, LOCATION_NOT_ROUTABLE, ROUTING_UNAVAILABLE, ROUTING_TIMEOUT, UPSTREAM_INVALID_RESPONSE, STOP_INDEX_UNAVAILABLE, INTERNAL]
            message: { type: string }
            details:
              type: array
              items: { $ref: "#/components/schemas/ErrorDetail" }
            requestId: { type: string }
